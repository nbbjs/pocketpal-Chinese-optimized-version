name: 构建 APK（国内镜像版）

# 这是一条新增的工作流，上游的 .github/workflows/release.yml 未做任何修改。
# 目的：在 fork 上复现 release.yml 的 Android 构建环境（含高通 NPU 后端），
# 只跑到 assembleProdRelease 出 APK，不做版本 bump、不推 tag、不上传 Play、不跑 iOS。

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "构建目标"
        required: false
        default: "assembleProdRelease"
        type: choice
        options:
          - assembleProdRelease
          - bundleProdRelease

jobs:
  build_android:
    runs-on: ubuntu-latest
    # 与 release.yml 的区别：这里只读代码，不需要 contents:write / id-token
    permissions:
      contents: read

    env:
      # 与 release.yml 完全一致：llama.rn 必须从源码编译，否则没有 Hexagon(NPU) 后端
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: "true"
      # 与 release.yml 完全一致：从源码构建时跳过 postinstall 的预编译产物下载
      RNLLAMA_SKIP_POSTINSTALL: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 与 release.yml 一致：必须在 setup-java / setup-node 之前腾空间，
      # 因为 /opt/hostedtoolcache 正是它们安装的位置；Hexagon SDK 约需 3.1GB。
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.21.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      # 与 release.yml 一致：变体白名单来自 payload manifest，一份声明两处使用
      - name: Derive the rnllama variant allowlist from the payload manifest
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      # 与 release.yml 一致：这道 action 决定 APK 里到底有没有 NPU 后端。
      # 它按 SHA-256 双摘要校验第三方重打包的 Hexagon SDK，本 fork 不改动它。
      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true

      # 本 fork 唯一新增的环境步骤：只补 runner 上的 SDK 组件，
      # 不改 app 代码、不改依赖版本。缺哪个装哪个，已存在则秒过。
      - name: Ensure required NDK / CMake / platform components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "${SDKM:-}" ] || [ ! -x "$SDKM" ]; then
            echo "::warning::找不到 sdkmanager，跳过组件补装；若 gradle 报 NDK 缺失即为本因"
            exit 0
          fi
          echo "== 当前已安装 =="
          yes | "$SDKM" --list_installed 2>/dev/null | grep -iE "ndk|cmake|platforms;android-36|build-tools" || true
          echo "== 补装 ndk;27.3.13750724 / cmake;3.22.1 / platforms;android-36 =="
          yes | "$SDKM" "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-36" >/dev/null || true
          echo "== 补装后 NDK 目录 =="
          ls -d "$SDK_ROOT"/ndk/* 2>/dev/null || echo "(无)"

      # 上游靠 secret GOOGLE_SERVICES_JSON 由 fastlane 写入该文件，且它被 .gitignore 忽略。
      # 本 fork 没有任何 Firebase 凭据，这里写一个结构合法的占位文件仅为跑通构建：
      # App 可正常启动使用，只有「上传跑分排行」与「提交反馈」两个功能不可用。
      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-mirror-placeholder",
              "storage_bucket": "pocketpal-mirror-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPLACEHOLDERPLACEHOLDERPLACEHOL"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJSON

      # 与 release.yml 的 .env 结构一致；本 fork 未配置 vars，取值为空，
      # 代码里对空值有降级处理（Supabase/PalsHub 未配置即不启用）。
      - name: Create .env file
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=${{ vars.FIREBASE_FUNCTIONS_URL }}

          # PalsHub/Supabase Configuration
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          PALSHUB_API_BASE_URL=${{ vars.PALSHUB_API_BASE_URL }}

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EOL

      # 相当于 release.yml 的 fastlane build_android_release，但直接调 gradle：
      # 1) 不写真实 keystore（build.gradle 无凭据时自动回落 debug 签名并打印警告）
      # 2) 不构建 AAB、不上传 Play、不推 tag
      - name: Build Android APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
        run: |
          set -euo pipefail
          if [ "${ORG_GRADLE_PROJECT_rnllamaBuildFromSource:-}" != "true" ]; then
            echo "::error::ORG_GRADLE_PROJECT_rnllamaBuildFromSource 不是 true，NPU 后端不会被编译"
            exit 1
          fi
          cd android
          # 不加 -PreactNativeArchitectures 限制：上游 build.gradle 的 abiFilters 是
          # arm64-v8a + x86_64 双 ABI，payload 闸门的 manifest 同样要求 x86_64 的
          # librnllama 库齐全。上一轮只编 arm64 被闸门判 FAIL（arm64 侧已 12/12 通过）。
          ./gradlew --no-daemon "${{ github.event.inputs.gradle_task || 'assembleProdRelease' }}" \
            2>&1 | tee android-build.log

      # 与 release.yml 一致：证明变体白名单真的传进了 llama.rn 子工程
      - name: Verify the variant allowlist reached the llama.rn build
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          if ! grep -qF "Building rnllama variants: $VARIANTS" android/android-build.log; then
            echo "::error::llama.rn 没有报告它实际编译的变体集合。"
            echo "Expected: $VARIANTS"
            grep -F "rnllama variants" android/android-build.log || echo "  (日志里没有这一行)"
            exit 1
          fi
          echo "OK: llama.rn 已按声明编译变体"

      # 与 release.yml 一致：校验产物里 NPU 后端库/DSP 资产与导出符号齐全
      - name: Verify the Android payload
        run: |
          set -euo pipefail
          TASK="${{ github.event.inputs.gradle_task || 'assembleProdRelease' }}"
          if [ "$TASK" = "bundleProdRelease" ]; then
            node scripts/verify-android-payload.js \
              --aab android/app/build/outputs/bundle/prodRelease/app-prod-release.aab \
              --report payload-report.txt
          else
            node scripts/verify-android-payload.js \
              --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk \
              --report payload-report.txt
          fi
          cat payload-report.txt

      - name: Upload payload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-report
          path: payload-report.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-apk-prod-release
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 30
